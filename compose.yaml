services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: turnoment
      POSTGRES_USER: turnoment
      POSTGRES_PASSWORD: turnoment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnoment -d turnoment"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - turnoment_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turnoment_postgres:
